  if(has(e,'LINK_INVALID')){kept.key='';keep();s.view='nokey';s.failed='주소가 바뀌었습니다. 관리자에게 새 [내 근무 입력] 주소를 받아 주세요.';}else{s.view='fail';s.failed=cloud.explain(e);}
  render();return false;}
}
const start=()=>token()?loadPeriod(S.period(today()).key,true):openNames();
async function submitPin(pin){
 const p=s.pick;if(!p||s.busy)return;s.busy=true;say('확인하고 있습니다…');
 try{
  const r=await cloud.staffEnter(kept.key,p.id,pin,SITE);
  if(r.ok){kept.tokens[p.id]=r.token;kept.who=p.id;keep();s.periods={};say('');s.busy=false;await loadPeriod(S.period(today()).key,true);return;}
  s.pin='';s.first='';if(r.error==='PIN_WRONG'&&!p.pin)p.pin=true;
  say(r.error==='PIN_LOCKED'?'여러 번 틀려 잠겼습니다. 관리자에게 숫자 초기화를 부탁해 주세요.':r.error==='PIN_WAIT'?`여러 번 틀렸습니다. ${r.minutes||10}분 뒤에 다시 넣어 주세요.`:`숫자가 틀렸습니다. (${r.left}번 더 틀리면 잠깁니다)`,true);
 }catch(e){s.pin='';s.first='';if(has(e,'LINK_INVALID')){s.busy=false;await openNames();return;}say(has(e,'PERSON_NOT_FOUND')?'명부에서 찾지 못했습니다. 관리팀에 알려 주세요.':cloud.explain(e),true);}
 finally{s.busy=false;if(s.view==='pin')render();}
}
async function pressKey(n){
 if(s.view!=='pin'||s.busy||s.pin.length>=4)return;s.pin+=n;render();if(s.pin.length<4)return;
 const pin=s.pin;
 if(s.pick.pin){await submitPin(pin);return;}
 if(!s.first){s.first=pin;s.pin='';say('');render();return;}
 if(s.first!==pin){s.first='';s.pin='';say('두 번 넣은 숫자가 다릅니다. 처음부터 다시 눌러 주세요.',true);render();return;}
 await submitPin(pin);
}
const TEXT={ENTRY_CLOSED:'이 기간은 입력이 잠겨 있습니다. 바꿀 일이 있으면 관리팀에 알려 주세요.',MARK_OUT_OF_SERVICE:'전입 전이거나 전출 뒤의 날짜입니다.',PLAN_CLOSED:'마감된 일정이라, 변경 요청시 관리팀에 문의 부탁드립니다.',INVALID_RECORD:'넣을 수 없는 글입니다. 20자 안으로 적어 주세요.'};
async function save(value){
 const x=cur(),day=s.day;if(!x||!day||s.busy||!x.open||!inService(x.row,day))return;s.busy=true;say('저장하고 있습니다…');
 try{const saved=await cloud.staffMineMark(token(),day,P.clean(value),SITE);if(saved.mark)x.marks[day]=saved.mark;else delete x.marks[day];x.stage=saved.stage||x.stage;
  const t=teamDay(x,day);if(t){const me=[...t.on,...t.off].find(p=>p.me)||{name:x.row.name,me:true},on=P.squash(saved.mark)==='●';t.on=t.on.filter(p=>!p.me);t.off=t.off.filter(p=>!p.me);(on?t.on:t.off).push(me);}
  s.day='';s.more=false;say(`${label(day)} → ${saved.mark?name(saved.mark):idle(day,holidays(x))} 저장했습니다.${x.stage==='revise'?' (수정으로 기록)':''}`);}
 catch(e){if(has(e,'SESSION_INVALID')){s.busy=false;await expired();return;}const k=Object.keys(TEXT).find(t=>has(e,t));say(k?TEXT[k]:cloud.explain(e),true);if(k&&k!=='INVALID_RECORD'){s.busy=false;await loadPeriod(s.key,true);say(TEXT[k],true);}}
 finally{s.busy=false;if(s.view==='cal')render();}
}
function show(on){
 if(on===s.on)return;s.on=on;box.hidden=!on;document.body.classList.toggle('my-on',on);
 if(on){s.note='';s.error=false;start();}else{s.serial++;try{if(HASH.test(root.location.hash))root.history.replaceState(root.history.state,'',root.location.pathname+root.location.search);}catch{}}
}
box.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 try{
  if(b.dataset.myPerson){s.pick=s.people.find(p=>p.id===b.dataset.myPerson)||null;if(!s.pick)return;s.pin='';s.first='';say('');
   if(kept.tokens[s.pick.id]){kept.who=s.pick.id;keep();s.periods={};await loadPeriod(S.period(today()).key,true);return;}
   s.view='pin';render();return;}
  if(b.dataset.myKey!==undefined){await pressKey(b.dataset.myKey);return;}
  if(b.dataset.my==='pin-back'){s.pin=s.pin.slice(0,-1);render();return;}
  if(b.dataset.my==='pin-clear'){s.pin='';s.first='';say('');render();return;}
  if(b.dataset.my==='names'){say('');await openNames();return;}
  if(b.dataset.my==='leave'){const t=token();delete kept.tokens[kept.who];kept.who='';keep();s.periods={};try{if(t)await cloud.staffLeave(t,SITE);}catch{}say('이 기기에서 나갔습니다.');await openNames();return;}
  if(b.dataset.my==='exit'){show(false);return;}
  if(b.dataset.my==='reload'){say('');if(s.view==='cal')await loadPeriod(s.key,true);else await start();return;}
  if(b.dataset.my==='prev'){await loadPeriod(S.period(S.shift(cur()?.start||S.period(today()).start,-1)).key);return;}
  if(b.dataset.my==='next'){await loadPeriod(S.period(S.shift(cur()?.end||S.period(today()).end,1)).key);return;}
  if(b.dataset.my==='now'){await loadPeriod(S.period(today()).key);return;}
  if(b.dataset.myDay){s.day=s.day===b.dataset.myDay?'':b.dataset.myDay;s.more=false;render();return;}
  if(b.dataset.my==='close'){s.day='';s.more=false;render();return;}
  if(b.dataset.my==='more'){s.more=true;render();return;}
  if(b.dataset.my==='text'){await save(box.querySelector('[data-my-text]').value);return;}
  if(b.dataset.myMark!==undefined){await save(b.dataset.myMark);return;}
 }catch(err){say(cloud.explain(err),true);}
});
box.addEventListener('input',e=>{if(e.target.matches('[data-my-find]')){s.find=e.target.value;box.querySelector('[data-my-names]').innerHTML=nameList();}});
document.addEventListener('keydown',e=>{if(!s.on||s.view!=='pin')return;if(/^[0-9]$/.test(e.key)){e.preventDefault();pressKey(e.key);}else if(e.key==='Backspace'){e.preventDefault();s.pin=s.pin.slice(0,-1);render();}});
function fromHash(){const m=HASH.exec(root.location.hash);if(!m)return false;if(m[1]&&m[1]!==kept.key){kept.key=m[1];keep();}return true;}
root.addEventListener?.('hashchange',()=>{if(fromHash()){if(s.on)start();else show(true);}});
root.addEventListener?.('load',keepHash);
/* 밖에서 쓰는 한 파일짜리 화면(SITE_MY_ONLY)은 주소에 #my 가 없어도 이 화면뿐이다. */
if(fromHash()||root.SITE_MY_ONLY)show(true);
root.SiteStaffMyUI={open:()=>show(true),close:()=>show(false),get shown(){return s.on;}};
})(globalThis);
</script>
</body>
